---
# CUST-Z: VPWS customer, Z-side (single-homed).
# Single-homed to CLAK-B:Ethernet3/1.
# VPWS carries VLAN 100 from CUST-A on the A-side (SGRL-A + CORP-A).
hostname: CUST-Z

aaa_authentication:
  login:
    default: local
    console: local
aaa_authorization:
  exec:
    default: local

ip_routing: true
service_routing_protocols_model: multi-agent

local_users:
  - name: admin
    privilege: 15
    role: network-admin
    sha512_password: $6$n5UzLR7bucITZ.fE$BoS3AU71MBIDlSsWb1NpH0P62l9AyanxImmA.9OKesBuClBXXae3oMf0fm1HA.3rxwzvbkbVl.QarZAHgm7V81

management_interfaces:
  - name: Management0
    description: OOB_MANAGEMENT
    shutdown: false
    vrf: OOB
    ip_address: 192.168.128.231/24
    type: oob
    gateway: 192.168.128.254
    eos_cli: |
      no lldp transmit
      no lldp receive

management_api_http:
  enable_https: true
  enable_vrfs:
    - name: OOB

vrfs:
  - name: OOB
    ip_routing: false

ethernet_interfaces:
  - name: Ethernet1
    description: "CLAK-B uplink (VPWS Z-side)"
    shutdown: false
    switchport:
      enabled: false
  - name: Ethernet1.100
    description: "VPWS service VLAN 100"
    shutdown: false
    encapsulation_vlan:
      client:
        encapsulation: dot1q
        vlan: 100
    ip_address: 192.168.100.2/24

loopback_interfaces:
  - name: Loopback0
    description: "CUST-Z Loopback"
    shutdown: false
    ip_address: 10.200.0.2/32

static_routes:
  - vrf: OOB
    prefix: 0.0.0.0/0
    next_hop: 192.168.128.254
