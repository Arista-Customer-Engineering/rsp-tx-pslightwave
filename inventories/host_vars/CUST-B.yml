---
# CUST-B: DIA customer on SGRL-A with two eBGP sessions:
#   1. SGRL-A (direct on P2P) — partial table (whatever SGRL-A knows)
#   2. CYWE-A Lo30 (multi-hop via SGRL-A) — full internet table
# SGRL-A redistributes the 198.51.100.20/31 connected route into EVPN,
# so CYWE-A can reach CUST-B's interface IP for the multi-hop session.
hostname: CUST-B

aaa_authentication:
  login:
    default: local
    console: local
aaa_authorization:
  exec:
    default: local

ip_routing: true
service_routing_protocols_model: multi-agent

local_users:
  - name: admin
    privilege: 15
    role: network-admin
    sha512_password: $6$n5UzLR7bucITZ.fE$BoS3AU71MBIDlSsWb1NpH0P62l9AyanxImmA.9OKesBuClBXXae3oMf0fm1HA.3rxwzvbkbVl.QarZAHgm7V81

management_interfaces:
  - name: Management0
    description: OOB_MANAGEMENT
    shutdown: false
    vrf: OOB
    ip_address: 192.168.128.232/24
    type: oob
    gateway: 192.168.128.254
    eos_cli: |
      no lldp transmit
      no lldp receive

management_api_http:
  enable_https: true
  enable_vrfs:
    - name: OOB

vrfs:
  - name: OOB
    ip_routing: false

ethernet_interfaces:
  - name: Ethernet1
    description: "SGRL-A DIA uplink"
    shutdown: false
    ip_address: 198.51.100.20/31
    switchport:
      enabled: false

static_routes:
  - vrf: OOB
    prefix: 0.0.0.0/0
    next_hop: 192.168.128.254
  - prefix: 80.50.0.0/24
    interface: "null0"

router_bgp:
  as: '65501'
  router_id: 198.51.100.20
  neighbors:
    - ip_address: 198.51.100.21
      remote_as: '394437'
      description: "SGRL-A (direct, partial table)"
      shutdown: false
    - ip_address: 80.100.0.1
      remote_as: '394437'
      description: "CYWE-A Lo30 (multi-hop, full table)"
      shutdown: false
      ebgp_multihop: 5
      update_source: Ethernet1
  redistribute:
    static:
      enabled: true
      route_map: ADV_CUST
  address_family_ipv4:
    neighbors:
      - ip_address: 198.51.100.21
        activate: true
      - ip_address: 80.100.0.1
        activate: true

prefix_lists:
  - name: ADV_CUST
    sequence_numbers:
      - sequence: 10
        action: "permit 80.50.0.0/24"

route_maps:
  - name: ADV_CUST
    sequence_numbers:
      - sequence: 10
        type: permit
        match:
          - "ip address prefix-list ADV_CUST"
      - sequence: 20
        type: deny
