---
# CUST-C: DIA customer on SGRL-A via VPWS to CYWE-A (full-table PE).
# Physical link to SGRL-A:Ethernet3, but the VPWS extends L2 to CYWE-A.
# eBGP peering with CYWE-A through the pseudowire, receives full table.
# Customer sends VLAN 200 tagged traffic.
hostname: CUST-C

aaa_authentication:
  login:
    default: local
    console: local
aaa_authorization:
  exec:
    default: local

ip_routing: true
service_routing_protocols_model: multi-agent

local_users:
  - name: admin
    privilege: 15
    role: network-admin
    sha512_password: $6$n5UzLR7bucITZ.fE$BoS3AU71MBIDlSsWb1NpH0P62l9AyanxImmA.9OKesBuClBXXae3oMf0fm1HA.3rxwzvbkbVl.QarZAHgm7V81

management_interfaces:
  - name: Management0
    description: OOB_MANAGEMENT
    shutdown: false
    vrf: OOB
    ip_address: 192.168.128.233/24
    type: oob
    gateway: 192.168.128.254
    eos_cli: |
      no lldp transmit
      no lldp receive

management_api_http:
  enable_https: true
  enable_vrfs:
    - name: OOB

vrfs:
  - name: OOB
    ip_routing: false

ethernet_interfaces:
  - name: Ethernet1
    description: "SGRL-A VPWS uplink (via CYWE-A patch)"
    shutdown: false
    switchport:
      enabled: false
  - name: Ethernet1.200
    description: "DIA service VLAN"
    shutdown: false
    encapsulation_vlan:
      client:
        encapsulation: dot1q
        vlan: 200
    ip_address: 198.51.100.22/31

static_routes:
  - vrf: OOB
    prefix: 0.0.0.0/0
    next_hop: 192.168.128.254

router_bgp:
  as: '65502'
  router_id: 198.51.100.22
  neighbors:
    - ip_address: 198.51.100.23
      remote_as: '394437'
      description: "CYWE-A INTERNET VRF (via VPWS)"
      shutdown: false
  redistribute:
    static:
      enabled: true
  address_family_ipv4:
    neighbors:
      - ip_address: 198.51.100.23
        activate: true

ip_route:
  - destination: 80.51.0.0/24
    interface: "null0"
