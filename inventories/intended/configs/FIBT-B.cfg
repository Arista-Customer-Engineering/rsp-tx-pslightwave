!
ip community-list CACHES permit 65000:2000
ip community-list CUSTOMERS permit 65000:4000
ip community-list PROVIDER permit 65000:64496
!
ip prefix-list DEFAULT_ONLY
   seq 10 permit 0.0.0.0/0
!
ip prefix-list PROVIDER_ROUTES
   seq 10 permit 80.0.0.0/16 le 24
   seq 20 permit 81.0.0.0/16 le 24
   seq 30 permit 82.0.0.0/16 le 24
ipv6 unicast-routing vrf INTERNET
!
ip route vrf INTERNET 0.0.0.0/0 Null0 250
ip route vrf INTERNET 80.0.0.0/16 Null0 255
ip route vrf INTERNET 81.0.0.0/16 Null0 255
ip route vrf INTERNET 82.0.0.0/16 Null0 255
ip route vrf OOB 0.0.0.0/0 192.168.128.254
!
ipv6 route vrf INTERNET 0::0/0 Null0 255
ipv6 route vrf INTERNET 2001:db8:8000::/33 Null0 255
!
mpls ip
!
ntp server vrf OOB 192.5.41.40
ntp server vrf OOB 192.5.41.41
ntp server vrf OOB 192.5.41.209 prefer
!
route-map DEFAULT_ONLY permit 10
   match ip address prefix-list DEFAULT_ONLY
!
route-map DEFAULT_ONLY deny 20
!
route-map PROVIDER_ROUTES_ONLY permit 10
   match ip address prefix-list PROVIDER_ROUTES
!
route-map PROVIDER_ROUTES_ONLY deny 20
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 172.16.0.6
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor MPLS-OVERLAY-PEERS peer group
   neighbor MPLS-OVERLAY-PEERS remote-as 65000
   neighbor MPLS-OVERLAY-PEERS update-source Loopback0
   neighbor MPLS-OVERLAY-PEERS send-community
   neighbor MPLS-OVERLAY-PEERS maximum-routes 0
   neighbor PROVIDER peer group
   neighbor PROVIDER local-as 394437 no-prepend replace-as
   neighbor 172.16.0.201 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.201 description CORP-R_Loopback0
   neighbor 172.16.0.202 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.202 description FIBT-R_Loopback0
   neighbor 172.16.0.203 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.203 description CLAK-R_Loopback0
   !
   address-family evpn
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
      neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor MPLS-OVERLAY-PEERS activate
   !
   address-family rt-membership
      neighbor MPLS-OVERLAY-PEERS activate
   !
   vrf INBAND_MGMT
      rd 172.16.0.6:0
      route-target import evpn 65000:0
      route-target export evpn 65000:0
      router-id 172.16.0.6
      redistribute connected
      redistribute static
   !
   vrf INTERNET
      rd 172.16.0.6:30000
      route-target import evpn 65000:30000
      route-target export evpn 65000:30000
      router-id 172.16.0.6
      neighbor 198.51.100.4 peer group PROVIDER
      neighbor 198.51.100.4 remote-as 3356
      neighbor 198.51.100.4 description AS3356 Lumen
      neighbor 2603::0 peer group PROVIDER
      neighbor 2603::0 remote-as 3356
      neighbor 2603::0 description AS3356 Lumen
      redistribute connected rcf REDISTRIBUTE_INTERNET()
      redistribute static rcf REDISTRIBUTE_INTERNET()
      !
      address-family ipv4
         neighbor 198.51.100.4 activate
      !
      address-family ipv6
         neighbor 2603::0 activate
!
router general
   control-functions
      code unit VRF_REDISTRIBUTION
         function REDISTRIBUTE_INTERNET() {
             if (source_protocol is CONNECTED or source_protocol is STATIC) {
                 community add community_list PROVIDER;
             }
             return true;
         }
         EOF

   !
   exit
   exit
!
router isis CORE
   net 49.0001.1720.1600.0006.00
   router-id ipv4 172.16.0.6
   is-type level-2
   log-adjacency-changes
   timers local-convergence-delay 10000 protected-prefixes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode node-protection
   !
   segment-routing mpls
      no shutdown
!
management ssh
   idle-timeout 15
   shutdown
   !
   vrf OOB
      no shutdown
   !
   vrf default
      no shutdown
