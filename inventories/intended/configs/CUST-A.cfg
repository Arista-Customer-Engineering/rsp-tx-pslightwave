username admin privilege 15 role network-admin secret sha512 $6$n5UzLR7bucITZ.fE$BoS3AU71MBIDlSsWb1NpH0P62l9AyanxImmA.9OKesBuClBXXae3oMf0fm1HA.3rxwzvbkbVl.QarZAHgm7V81
!
event-monitor
!
load-interval default 1
!
service routing protocols model multi-agent
!
hostname CUST-A
!
vrf instance OOB
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf OOB
      no shutdown
!
aaa authentication login default local
aaa authentication login console local
aaa authorization exec default local
!
interface Port-Channel1
   description VPWS ESI LAG to SGRL-A + CORP-A
   no shutdown
   no switchport
!
interface Port-Channel1.100
   description VPWS service VLAN 100
   no shutdown
   !
   encapsulation vlan
      client dot1q 100
   ip address 192.168.100.1/24
!
interface Ethernet1
   description SGRL-A uplink (VPWS A-side)
   no shutdown
   no switchport
   channel-group 1 mode active
!
interface Ethernet2
   description CORP-A uplink (VPWS A-side)
   no shutdown
   no switchport
   channel-group 1 mode active
!
interface Loopback0
   description CUST-A Loopback
   no shutdown
   ip address 10.200.0.1/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf OOB
   ip address 192.168.128.230/24
   no lldp transmit
   no lldp receive

!
ip routing
no ip routing vrf OOB
!
ip route vrf OOB 0.0.0.0/0 192.168.128.254
