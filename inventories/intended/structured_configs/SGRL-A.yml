- name: DEFAULT_ONLY
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list DEFAULT_ONLY
  - sequence: 20
    type: deny
- name: PROVIDER_ROUTES_ONLY
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PROVIDER_ROUTES
  - sequence: 20
    type: deny
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 172.16.0.101
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MPLS-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65000'
    update_source: Loopback0
    bfd: false
    send_community: all
    maximum_routes: 0
  - name: DIA_FULL_TABLE
    local_as: '394437'
  neighbors:
  - ip_address: 172.16.0.203
    peer_group: MPLS-OVERLAY-PEERS
