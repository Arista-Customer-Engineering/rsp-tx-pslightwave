    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_rtc:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: INBAND_MGMT
    rd: 172.16.0.101:0
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - '65000:0'
      export:
      - address_family: evpn
        route_targets:
        - '65000:0'
    router_id: 172.16.0.101
    redistribute:
      connected:
        enabled: true
      static:
        enabled: true
  - name: INTERNET
    rd: 172.16.0.101:30000
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 65000:30000
      export:
      - address_family: evpn
        route_targets:
        - 65000:30000
    router_id: 172.16.0.101
    neighbors:
    - ip_address: 198.51.100.20
      peer_group: DIA_FULL_TABLE
      remote_as: '65501'
      description: 'DIA: CUST-B (direct, partial table)'
    redistribute:
      connected:
        enabled: true
        rcf: REDISTRIBUTE_INTERNET()
      static:
        enabled: true
        rcf: REDISTRIBUTE_INTERNET()
    address_family_ipv4:
      neighbors:
      - ip_address: 198.51.100.20
        activate: true
