    rd: 172.16.0.101:28000
    route_targets:
      import_export: 65000:28000
    pseudowires:
    - name: CUST-A-TO-CUST-Z_100
      id_local: 101
      id_remote: 102
    - name: DIA-CUST-C-VPWS_200
      id_local: 201
      id_remote: 202
