    metadata:
      peer: TSHL-B
    description: TSHL-B_Loopback0
  address_family_evpn:
    neighbor_default:
      encapsulation: mpls
    neighbors:
    - ip_address: 172.16.0.101
      rcf_out: EXPORT_PARTIAL()
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_rtc:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
      default_route_target:
        only: true
  address_family_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: false
router_general:
  control_functions:
    code_units:
    - name: EVPN_EXPORT_FILTERS
      content: "function EXPORT_PARTIAL() {\n    if (ext_community has_any {ROUTE-TARGET-AS:65000:30000}) {\n        if (evpn.ip_prefix_route.prefix
        is 0.0.0.0/0 or evpn.ip_prefix_route.prefix is ::/0) {\n            return true;\n        }\n        if (community match community_list
        PROVIDER) or\n           (community match community_list CUSTOMERS) or\n           (community match community_list CACHES) {\n
        \           return true;\n        }\n        if (evpn.route_type is_not EVPN_IP_PREFIX) {\n            return true;\n        }\n
        \       return false;\n    }\n    return true;\n}\nEOF\n"
