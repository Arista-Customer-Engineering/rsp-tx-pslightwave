########################################################
# VPWS Customer Endpoint Attachments
# Physical port-channel definitions only (channel_id, LACP).
# Subinterfaces, encapsulation, and pseudowire binding are
# handled by services_vpws.yml.
########################################################
endpoints_vpws:
  - name: "CUST-A"
    adapters:
      - switches: ["SGRL-A", "CORP-A"]
        switch_ports: ["Ethernet1", "Ethernet3/1"]
        ethernet_segment:
          short_esi: "{{ esi_CUST_A_VPWS }}"
        port_channel:
          mode: active
          channel_id: 1
