services_vpws:
  - name: "VPWS_SERVICES"
    pseudowire_rt_base: 28000
    point_to_point_services:
      ######################################################################
      # CUST-A <-> CUST-Z: Multihomed A-side (ESI LAG), single-homed Z-side
      # A-side Port-Channel1 is created by endpoints_vpws (connected_endpoints)
      # with channel_id: 1 to ensure matching OperKeys across SGRL-A and CORP-A.
      ######################################################################
      - name: "CUST-A-TO-CUST-Z"
        type: "vpws-pseudowire"
        subinterfaces:
          - number: 100
            structured_config:
              encapsulation_vlan:
                client:
                  encapsulation: "dot1q"
                  vlan: 100
                network:          
        endpoints:
          - id: 1
            nodes: ["SGRL-A", "CORP-A"]
            interfaces: ["Port-Channel1", "Port-Channel1"]
          - id: 2
            nodes: ["CLAK-B"]
            interfaces: ["Ethernet3/1"]
        lldp_disable: true
      ######################################################################
      # CUST-C DIA VPWS: SGRL-A -> CYWE-A (full-table PE via patch panel)
      ######################################################################
      - name: "DIA-CUST-C-VPWS"
        type: "vpws-pseudowire"
        subinterfaces:
          - number: 200
            port_channel:
              structured_config:
                encapsulation_vlan:
                  client:
                    encapsulation: "dot1q"
                    vlan: 200
                  network:
        endpoints:
          - id: 1
            nodes: ["SGRL-A"]
            interfaces: ["Ethernet3"]
          - id: 2
            nodes: ["CYWE-A"]
            interfaces: ["Ethernet4/1"]
