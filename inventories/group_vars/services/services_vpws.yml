services_vpws:
  - name: "VPWS_SERVICES"
    pseudowire_rt_base: 28000
    point_to_point_services:
      ######################################################################
      # CUST-A <-> CUST-Z: Multihomed A-side (ESI LAG), single-homed Z-side
      ######################################################################
      - name: "CUST-A-TO-CUST-Z"
        type: "vpws-pseudowire"
        subinterfaces:
          - number: 100
            structured_config:
              encapsulation_vlan:
                client:
                  encapsulation: "dot1q"
                  vlan: 100
                network:
        endpoints:
          - id: 1
            nodes: ["SGRL-A", "CORP-A"]
            interfaces: ["Ethernet1", "Ethernet3/1"]
            port_channel:
              mode: "active"
              short_esi: "{{ esi_CUST_A_VPWS }}"
          - id: 2
            nodes: ["CLAK-B"]
            interfaces: ["Ethernet3/1"]
      ######################################################################
      # CUST-C DIA VPWS: SGRL-A -> CYWE-A (full-table PE via patch panel)
      ######################################################################
      - name: "DIA-CUST-C-VPWS"
        type: "vpws-pseudowire"
        subinterfaces:
          - number: 200
            structured_config:
              encapsulation_vlan:
                client:
                  encapsulation: "dot1q"
                  vlan: 200
                network:
        endpoints:
          - id: 1
            nodes: ["SGRL-A"]
            interfaces: ["Ethernet3"]
          - id: 2
            nodes: ["CYWE-A"]
            interfaces: ["Ethernet4/1"]
