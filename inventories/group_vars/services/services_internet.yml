#######################################################################################
# All Internet Services - Transits, Peering, and Dedicated Internet
#######################################################################################
services_internet: # Network services key
  - name: "INTERNET"
    mac_vrf_id_base: 30000
    vrfs:
      - name: "INTERNET"
        structured_config:
          vrfs:
            - name: "INTERNET"
              ipv6_routing: true
        description: "Public INTERNET VRF"
        address_families: ["evpn"]
        vrf_id: 30000
        redistribute_static: true
        vtep_diagnostic:
          loopback: 30
          loopback_description: "Internet Loopback"
          loopback_ip_range: "80.100.0.0/24"
          loopback_ipv6_range: "2001:db8:8000:30::/64"
          hardware_forwarding: true
        ############### DEFAULT ROUTE ORIGINATION ###############
        static_routes:
          - prefix: "0.0.0.0/0"
            interface: "null0"
            nodes: ["CYWE-A", "CYWE-B", "FIBT-B", "TSHL-A", "CYGA-A"]
            distance: 250
          ############### SUMMARY ROUTE PINNING #################
          - prefix: "80.0.0.0/16"
            interface: "null0"
            nodes: ["CYWE-A", "CYWE-B", "FIBT-B", "TSHL-A", "CYGA-A"]
            distance: 255
          - prefix: "81.0.0.0/16"
            interface: "null0"
            nodes: ["CYWE-A", "CYWE-B", "FIBT-B", "TSHL-A", "CYGA-A"]
            distance: 255
          - prefix: "82.0.0.0/16"
            interface: "null0"
            nodes: ["CYWE-A", "CYWE-B", "FIBT-B", "TSHL-A", "CYGA-A"]
            distance: 255
          ########### END OF SUMMARY ROUTE PINNING ###############
          ########### CUSTOMER STATIC ALLOCATIONS ################
          - prefix: "80.50.0.0/24"
            interface: "null0"
            nodes: ["SGRL-A"]
            distance: 254
          - prefix: "80.51.0.0/24"
            interface: "null0"
            nodes: ["CYWE-A"]
            distance: 254
          - prefix: "80.52.0.0/24"
            interface: "null0"
            nodes: ["CYGA-A"]
            distance: 254
          ########## END OF CUSTOMER STATIC ALLOCATIONS ##########
          ########### CUST-B MULTI-HOP eBGP STATIC ###############
          - prefix: "198.51.100.30/32"
            next_hop: "198.51.100.20"
            nodes: ["SGRL-A"]
          ########### END OF CUST-B MULTI-HOP eBGP STATIC ########
        ipv6_static_routes:
          ############### SUMMARY ROUTE PINNING #################
          - prefix: "0::0/0"
            interface: "null0"
            nodes: ["CYWE-A", "CYWE-B", "FIBT-B", "TSHL-A", "CYGA-A"]
            distance: 255
          - prefix: "2001:db8:8000::/33"
            interface: "null0"
            nodes: ["CYWE-A", "CYWE-B", "FIBT-B", "TSHL-A", "CYGA-A"]
            distance: 255
          ########### END OF SUMMARY ROUTE PINNING ###############
          ########### CUSTOMER STATIC ALLOCATIONS ################
          ########## END OF CUSTOMER STATIC ALLOCATIONS ##########
        ########################################################
        l3_interfaces:
          ############# Transit Peering Point to Points ############
          - nodes: ["CYWE-A"]
            interfaces: ["Ethernet2/1"]
            ip_addresses: ["198.51.100.1/31"]
            descriptions: ["Arelion Peering"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2601::1/127"
              ipv6_nd:
                ra:
                  disabled: true
          - nodes: ["CYWE-B"]
            interfaces: ["Ethernet2/1"]
            ip_addresses: ["198.51.100.3/31"]
            descriptions: ["Cogent Peering"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2602::1/127"
              ipv6_nd:
                ra:
                  disabled: true
          - nodes: ["FIBT-B"]
            interfaces: ["Ethernet2/1"]
            ip_addresses: ["198.51.100.5/31"]
            descriptions: ["Lumen Peering"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2603::1/127"
              ipv6_nd:
                ra:
                  disabled: true
          - nodes: ["TSHL-A"]
            interfaces: ["Ethernet2/1"]
            ip_addresses: ["198.51.100.7/31"]
            descriptions: ["NTT Peering"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2604::1/127"
              ipv6_nd:
                ra:
                  disabled: true
          - nodes: ["CYGA-A"]
            interfaces: ["Ethernet2/1"]
            ip_addresses: ["198.51.100.9/31"]
            descriptions: ["GTT Peering"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2605::1/127"
              ipv6_nd:
                ra:
                  disabled: true
          ############# END OF Transit Peering Point to Points ############
          ############# DIA Customer Point to Points ############
          - nodes: ["SGRL-A"]
            interfaces: ["Ethernet2"]
            ip_addresses: ["198.51.100.21/31"]
            descriptions: ["DIA: CUST-B (multi-hop eBGP)"]
          - nodes: ["CYWE-A"]
            interfaces: ["Ethernet5/1.200"]
            ip_addresses: ["198.51.100.23/31"]
            descriptions: ["DIA: CUST-C (VPWS patch port)"]
            structured_config:
              encapsulation_vlan:
                client:
                  encapsulation: "dot1q"
                  vlan: 200
          - nodes: ["CYGA-A"]
            interfaces: ["Ethernet3/1"]
            ip_addresses: ["198.51.100.25/31"]
            descriptions: ["DIA: CUST-D (full table)"]
          ############# END OF DIA Customer Point to Points ############
        bgp_peer_groups:
          - name: "PROVIDER"
            local_as: 394437
            address_family_ipv4:
          - name: "DIA_FULL_TABLE"
            local_as: 394437
          - name: "DIA_DEFAULT_ONLY"
            local_as: 394437
            default_originate:
              enabled: true
              always: true
            route_map_out: "DEFAULT_ONLY"
        bgp_peers:
          ########### TRANSIT IPv4 PEERS ###########
          - nodes: ["CYWE-A"]
            peer_group: PROVIDER
            description: "AS1299 Arelion"
            ip_address: "198.51.100.0"
            shutdown: false
            remote_as: 1299
          - nodes: ["CYWE-B"]
            peer_group: PROVIDER
            description: "AS174 Cogent"
            ip_address: "198.51.100.2"
            shutdown: false
            remote_as: 174
          - nodes: ["FIBT-B"]
            peer_group: PROVIDER
            description: "AS3356 Lumen"
            ip_address: "198.51.100.4"
            shutdown: false
            remote_as: 3356
          - nodes: ["TSHL-A"]
            peer_group: PROVIDER
            description: "AS2914 NTT"
            ip_address: "198.51.100.6"
            shutdown: false
            remote_as: 2914
          - nodes: ["CYGA-A"]
            peer_group: PROVIDER
            description: "AS3257 GTT"
            ip_address: "198.51.100.8"
            shutdown: false
            remote_as: 3257
          ########### TRANSIT IPv6 PEERS ###########
          - nodes: ["CYWE-A"]
            peer_group: PROVIDER
            description: "AS1299 Arelion"
            ip_address: "2601::0"
            shutdown: false
            remote_as: 1299
          - nodes: ["CYWE-B"]
            peer_group: PROVIDER
            description: "AS174 Cogent"
            ip_address: "2602::0"
            shutdown: false
            remote_as: 174
          - nodes: ["FIBT-B"]
            peer_group: PROVIDER
            description: "AS3356 Lumen"
            ip_address: "2603::0"
            shutdown: false
            remote_as: 3356
          - nodes: ["TSHL-A"]
            peer_group: PROVIDER
            description: "AS2914 NTT"
            ip_address: "2604::0"
            shutdown: false
            remote_as: 2914
          - nodes: ["CYGA-A"]
            peer_group: PROVIDER
            description: "AS3257 GTT"
            ip_address: "2605::0"
            shutdown: false
            remote_as: 3257
          ########### DIA CUSTOMER PEERS ###########
          - nodes: ["SGRL-A"]
            peer_group: DIA_DEFAULT_ONLY
            description: "DIA: CUST-B (multi-hop eBGP)"
            ip_address: "198.51.100.30"
            remote_as: 65501
            ebgp_multihop: 2
            set_ipv4_next_hop: "198.51.100.21"
          - nodes: ["CYWE-A"]
            peer_group: DIA_FULL_TABLE
            description: "DIA: CUST-C (VPWS)"
            ip_address: "198.51.100.22"
            remote_as: 65502
          - nodes: ["CYGA-A"]
            peer_group: DIA_FULL_TABLE
            description: "DIA: CUST-D (full table)"
            ip_address: "198.51.100.24"
            remote_as: 65503
