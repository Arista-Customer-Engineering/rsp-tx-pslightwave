########################################################################################
# The minimum required configuration to construct an MPLS Fabric - No services
########################################################################################
fabric_name: mpls
dc_name: RSP
mgmt_interface_settings:
  interface: "Management0"
  vrf: "OOB"
mgmt_destination_networks: ["0.0.0.0/0"]
mgmt_gateway: "{{ lab_settings.mgmt_gateway }}"

# Underlay Settings - IS-IS & Segment Routing
underlay_routing_protocol: isis-sr
underlay_ipv6: false
isis_default_is_type: level-2
isis_default_circuit_type: level-2
isis_default_metric: 1000
isis_ti_lfa:
  enabled: true
  protection: "node"
  local_convergence_delay: 10000

# Overlay Settings - iBGP
overlay_routing_protocol: ibgp
evpn_overlay_bgp_rtc: true
bgp_as: 65000
bgp_mesh_pes: false
overlay_rt_type:
  admin_subfield: "bgp_as"
overlay_rd_type:
  admin_subfield: "overlay_loopback_ip"
bgp_peer_groups:
  evpn_overlay_peers:
    bfd: false
  rr_overlay_peers:
    bfd: false
  mpls_overlay_peers:
    bfd: false
  ipv4_underlay_peers:
    bfd: false

# fabric_sflow:
#   uplinks: true
#   downlinks: true
#   endpoints: true
#   l3_edge: true
#   core_interfaces: true
  # mlag_interfaces: true
  # l3_interfaces: true

sflow_settings:
  sample:
    rate: 8192
  destinations:
    - destination: 127.0.0.1
      vrf: default
  vrfs:
    - name: default
      source_interface: Loopback0

custom_templates:
- cpu_traffic_policy.j2
  #- tcam.j2


eos_designs_custom_templates:
- template: underlay_connectivity.j2
  options:
    list_merge: prepend
    strip_empty_keys: false

########################################################################################
# Built-in Node Types
########################################################################################
rr:
  defaults:
    virtual_router_mac_address: 00:c1:00:00:00:11
    isis_sr:
      ipv4_node_sid_index_base: 0
    overlay_address_families: ["evpn"]
    is_type: level-2
    isis_system_id_prefix: '0000.0000'
    loopback_ipv4_pool: 172.16.0.0/24
    platform: "7280SR3"
    raw_eos_cli: |
      platform tfa
        interface mode relaying
    filter:
      only_vlans_in_use: true
    structured_config:
      ip_community_lists:
        - name: PROVIDER
          entries:
            - action: permit
              communities: ["65000:64496"]
        - name: CUSTOMERS
          entries:
            - action: permit
              communities: ["65000:4000"]
        - name: CACHES
          entries:
            - action: permit
              communities: ["65000:2000"]
      router_general:
        control_functions:
          code_units:
            - name: EVPN_EXPORT_FILTERS
              content: |
                function EXPORT_PARTIAL() {
                    if (ext_community has_any {ROUTE-TARGET-AS:65000:30000}) {
                        if (evpn.ip_prefix_route.prefix is 0.0.0.0/0 or evpn.ip_prefix_route.prefix is ::/0) {
                            return true;
                        }
                        if (community match community_list PROVIDER) or
                           (community match community_list CUSTOMERS) or
                           (community match community_list CACHES) {
                            return true;
                        }
                        if (evpn.route_type is_not EVPN_IP_PREFIX) {
                            return true;
                        }
                        return false;
                    }
                    return true;
                }
                EOF
      router_bgp:
        peer_groups:
          - name: MPLS-OVERLAY-PEERS-PARTIAL
            remote_as: "65000"
            update_source: Loopback0
            route_reflector_client: true
            send_community: all
            maximum_routes: 0
        neighbors:
          - ip_address: "172.16.0.101"
            peer_group: MPLS-OVERLAY-PEERS-PARTIAL
            description: SGRL-A
        address_family_evpn:
          peer_groups:
            - name: MPLS-OVERLAY-PEERS-PARTIAL
              activate: true
              rcf_out: "EXPORT_PARTIAL()"
        address_family_rtc:
          peer_groups:
            - name: MPLS-OVERLAY-PEERS-PARTIAL
              activate: true
              default_route_target:
                only: true
  nodes:
    - name: "CORP-R"
      id: 201
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "FIBT-R"
      id: 202
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "CLAK-R"
      id: 203
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"      
pe:
  defaults:
    virtual_router_mac_address: 00:c1:00:00:00:11
    isis_sr:
      ipv4_node_sid_index_base: 0
    overlay_address_families: ["evpn"]
    is_type: level-2
    isis_system_id_prefix: '0000.0000'
    loopback_ipv4_pool: 172.16.0.0/24
    platform: "7280SR3"
    mpls_route_reflectors: ["CORP-R", "FIBT-R", "CLAK-R"]
    raw_eos_cli: |
      platform tfa
        interface mode relaying
    filter:
      always_include_vrfs_in_tenants: ["Inband Management"]
      only_vlans_in_use: true
    structured_config:
      router_general:
        control_functions:
          code_units:
            - name: VRF_REDISTRIBUTION
              content: |
                function REDISTRIBUTE_INTERNET() {
                    if (source_protocol is CONNECTED or source_protocol is STATIC) {
                        community add community_list PROVIDER;
                    }
                    return true;
                }
                EOF
      router_bgp:
        vrfs:
          - name: INTERNET
            redistribute:
              static:
                enabled: true
                rcf: "REDISTRIBUTE_INTERNET()"
              connected:
                enabled: true
                rcf: "REDISTRIBUTE_INTERNET()"
  node_groups:
  - group: "Core Routers"
    mpls_overlay_role: "client"
    evpn_role: "client"
    bgp_cluster_id: 172.16.0.0
    nodes:
    - name: "CYWE-A"
      id: 1
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "CYWE-B"
      id: 2
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "CORP-A"
      id: 3
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "CORP-B"
      id: 4
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "FIBT-A"
      id: 5
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "FIBT-B"
      id: 6
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}" 
    - name: "CYGA-A"
      id: 7
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "CYGA-B"
      id: 8
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "TSHL-A"
      id: 9
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "TSHL-B"
      id: 10
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "CLAK-A"
      id: 11
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "CLAK-B"
      id: 12
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"                            
  - group: "Hub Routers"
    mpls_overlay_role: "client"
    evpn_role: "client"
    nodes:
    - name: "SGRL-A"
      id: 101
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
