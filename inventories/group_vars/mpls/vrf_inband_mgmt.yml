########################################################
# Inband Management
########################################################
inband_management:
  - name: "Inband Management"
    mac_vrf_id_base: 0
    vrfs:
      - name: "INBAND_MGMT"
        description: "Inband Management VRF"
        address_families: ["evpn"]
        vrf_id: 0
        redistribute_static: true
        vtep_diagnostic:
          loopback: 2
          loopback_description: "[LOOPBACK_SVC]: Inband Management Loopback"
          loopback_ip_range: 172.16.2.0/24
          hardware_forwarding: true
