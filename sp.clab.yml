name: sp
mgmt:
  network: sp
  bridge: br1
  ipv4-subnet: 192.168.128.0/24
  ipv4-gw: 192.168.128.254
topology:
  kinds:
    ceos:
      image: arista/ceos:latest
      env:
        CLAB_MGMT_VRF: OOB
  nodes:
    ######################################################################
    # PE Nodes - 7280CR3AK-24D12
    ######################################################################
    CYWE-A:
      kind: ceos
      mgmt-ipv4: 192.168.128.1
      startup-config: inventories/intended/configs/CYWE-A.cfg
    CYWE-B:
      kind: ceos
      mgmt-ipv4: 192.168.128.2
      startup-config: inventories/intended/configs/CYWE-B.cfg
    CORP-A:
      kind: ceos
      mgmt-ipv4: 192.168.128.3
      startup-config: inventories/intended/configs/CORP-A.cfg
    CORP-B:
      kind: ceos
      mgmt-ipv4: 192.168.128.4
      startup-config: inventories/intended/configs/CORP-B.cfg
    FIBT-A:
      kind: ceos
      mgmt-ipv4: 192.168.128.5
      startup-config: inventories/intended/configs/FIBT-A.cfg
    FIBT-B:
      kind: ceos
      mgmt-ipv4: 192.168.128.6
      startup-config: inventories/intended/configs/FIBT-B.cfg
    CYGA-A:
      kind: ceos
      mgmt-ipv4: 192.168.128.7
      startup-config: inventories/intended/configs/CYGA-A.cfg
    CYGA-B:
      kind: ceos
      mgmt-ipv4: 192.168.128.8
      startup-config: inventories/intended/configs/CYGA-B.cfg
    TSHL-A:
      kind: ceos
      mgmt-ipv4: 192.168.128.9
      startup-config: inventories/intended/configs/TSHL-A.cfg
    TSHL-B:
      kind: ceos
      mgmt-ipv4: 192.168.128.10
      startup-config: inventories/intended/configs/TSHL-B.cfg
    CLAK-A:
      kind: ceos
      mgmt-ipv4: 192.168.128.11
      startup-config: inventories/intended/configs/CLAK-A.cfg
    CLAK-B:
      kind: ceos
      mgmt-ipv4: 192.168.128.12
      startup-config: inventories/intended/configs/CLAK-B.cfg
    SGRL-A:
      kind: ceos
      mgmt-ipv4: 192.168.128.20
      startup-config: inventories/intended/configs/SGRL-A.cfg
    ######################################################################
    # Route Reflectors - 7230R-4TX-4S
    ######################################################################
    CORP-R:
      kind: ceos
      mgmt-ipv4: 192.168.128.101
      startup-config: inventories/intended/configs/CORP-R.cfg
    FIBT-R:
      kind: ceos
      mgmt-ipv4: 192.168.128.102
      startup-config: inventories/intended/configs/FIBT-R.cfg
    CLAK-R:
      kind: ceos
      mgmt-ipv4: 192.168.128.103
      startup-config: inventories/intended/configs/CLAK-R.cfg
    ######################################################################
    # Transit Provider Simulator
    ######################################################################
    TRANSIT:
      kind: ceos
      mgmt-ipv4: 192.168.128.220
      startup-config: inventories/intended/configs/TRANSIT.cfg
    ######################################################################
    # Customer Endpoints
    ######################################################################
    CUST-A:
      kind: linux
      image: ghcr.io/nicolaka/netshoot
      mgmt-ipv4: 192.168.128.230
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
    CUST-B:
      kind: ceos
      mgmt-ipv4: 192.168.128.232
      startup-config: inventories/intended/configs/CUST-B.cfg
    CUST-C:
      kind: ceos
      mgmt-ipv4: 192.168.128.233
      startup-config: inventories/intended/configs/CUST-C.cfg
    CUST-D:
      kind: ceos
      mgmt-ipv4: 192.168.128.234
      startup-config: inventories/intended/configs/CUST-D.cfg
    CUST-Z:
      kind: linux
      image: ghcr.io/nicolaka/netshoot
      mgmt-ipv4: 192.168.128.231
      exec:
        - ip link set eth1 up
  links:
    ######################################################################
    # Local Interlinks (Eth26/1 + Eth28/1 port-channel)
    ######################################################################
    - endpoints: [CYWE-A:eth26_1, CYWE-B:eth26_1]
    - endpoints: [CYWE-A:eth28_1, CYWE-B:eth28_1]
    - endpoints: [FIBT-A:eth26_1, FIBT-B:eth26_1]
    - endpoints: [FIBT-A:eth28_1, FIBT-B:eth28_1]
    - endpoints: [TSHL-A:eth26_1, TSHL-B:eth26_1]
    - endpoints: [TSHL-A:eth28_1, TSHL-B:eth28_1]
    - endpoints: [CORP-A:eth26_1, CORP-B:eth26_1]
    - endpoints: [CORP-A:eth28_1, CORP-B:eth28_1]
    - endpoints: [CYGA-A:eth26_1, CYGA-B:eth26_1]
    - endpoints: [CYGA-A:eth28_1, CYGA-B:eth28_1]
    - endpoints: [CLAK-A:eth26_1, CLAK-B:eth26_1]
    - endpoints: [CLAK-A:eth28_1, CLAK-B:eth28_1]
    ######################################################################
    # WAN Interlinks - Horizontal
    ######################################################################
    - endpoints: [CYWE-B:eth25_1, FIBT-A:eth25_1]
    - endpoints: [FIBT-B:eth25_1, TSHL-A:eth25_1]
    - endpoints: [CORP-B:eth25_1, CYGA-A:eth25_1]
    - endpoints: [CYGA-B:eth25_1, CLAK-A:eth25_1]
    ######################################################################
    # WAN Interlinks - Vertical
    ######################################################################
    - endpoints: [CYWE-A:eth25_1, CORP-A:eth25_1]
    - endpoints: [TSHL-B:eth25_1, CLAK-B:eth25_1]
    ######################################################################
    # WAN Interlinks - Cross-connects
    ######################################################################
    - endpoints: [CYWE-B:eth27_1, CYGA-A:eth27_1]
    - endpoints: [FIBT-A:eth27_1, CORP-B:eth27_1]
    ######################################################################
    # Hub Links - SGRL-A
    ######################################################################
    - endpoints: [SGRL-A:eth27_1, CYWE-A:eth1_1]
    - endpoints: [SGRL-A:eth28_1, CORP-A:eth1_1]
    ######################################################################
    # Route Reflector Links
    ######################################################################
    - endpoints: [CORP-R:eth1, CORP-A:eth29_1]
    - endpoints: [CORP-R:eth2, CORP-B:eth29_1]
    - endpoints: [FIBT-R:eth1, FIBT-A:eth29_1]
    - endpoints: [FIBT-R:eth2, FIBT-B:eth29_1]
    - endpoints: [CLAK-R:eth1, CLAK-A:eth29_1]
    - endpoints: [CLAK-R:eth2, CLAK-B:eth29_1]
    ######################################################################
    # Transit Peering
    ######################################################################
    - endpoints: [CYWE-A:eth2_1, TRANSIT:eth1]
    - endpoints: [CYWE-B:eth2_1, TRANSIT:eth2]
    - endpoints: [FIBT-B:eth2_1, TRANSIT:eth3]
    - endpoints: [TSHL-A:eth2_1, TRANSIT:eth4]
    - endpoints: [CYGA-A:eth2_1, TRANSIT:eth5]
      # TRANSIT internal loopback for carrier mesh
    - endpoints: [TRANSIT:eth6, TRANSIT:eth7]
    ######################################################################
    # Customer Endpoints - CUST-A (VPWS, multihomed A-side)
    ######################################################################
    - endpoints: [SGRL-A:eth1, CUST-A:eth1]
    - endpoints: [CORP-A:eth3_1, CUST-A:eth2]
    ######################################################################
    # Customer Endpoints - CUST-Z (VPWS, single-homed Z-side)
    ######################################################################
    - endpoints: [CLAK-B:eth3_1, CUST-Z:eth1]
    ######################################################################
    # DIA - CUST-B (multi-hop eBGP off SGRL-A)
    ######################################################################
    - endpoints: [SGRL-A:eth2, CUST-B:eth1]
    ######################################################################
    # DIA - CUST-C (VPWS from SGRL-A to CYWE-A patch panel)
    ######################################################################
    - endpoints: [SGRL-A:eth3, CUST-C:eth1]
    - endpoints: [CYWE-A:eth4_1, CYWE-A:eth5_1]
    ######################################################################
    # DIA - CUST-D (direct full-table off CYGA-A)
    ######################################################################
    - endpoints: [CYGA-A:eth3_1, CUST-D:eth1]
